[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chinese-medical-rag-qa"
version = "0.2.0"
description = "Evidence-first Chinese medical RAG research pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
api = ["fastapi==0.115.12", "uvicorn>=0.30,<1", "pydantic==2.10.6"]
ui = ["gradio==5.50.0", "fastapi==0.115.12", "pydantic==2.10.6", "httpx[socks]>=0.27,<1"]
# Chroma 0.6 requires the older PostHog API; newer Kubernetes pulls incompatible Pydantic.
dense = ["chromadb==0.6.3", "sentence-transformers==3.4.1", "kubernetes>=28,<33", "posthog>=2.4,<4"]
llm = ["torch>=2.5,<3", "transformers==4.48.3", "accelerate>=1.2,<2"]
train = ["torch>=2.5,<3", "transformers==4.48.3", "accelerate>=1.2,<2",
         "datasets>=3,<4", "peft==0.14.0", "bitsandbytes>=0.45,<0.46"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
ragqa = "ragqa.cli:main"

[tool.setuptools.packages.find]
include = ["ragqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: real optional backend integration"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
