name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests (pure CPU)
        run: |
          python tests/test_chunking.py
          python tests/test_data.py
          python tests/test_prompts.py
          python tests/test_retriever.py
          python tests/test_inference_clean.py
      - name: Verify installability (no heavy deps)
        run: |
          python -m pip install --no-deps -e .
          python -c "import ragqa; print('ragqa import ok')"
          ragqa-qa --help >/dev/null
      - name: Compile checks (no heavy imports)
        run: |
          python -m compileall -q ragqa scripts qa_system.py app_demo.py app_local.py document_processer.py